<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Thế Giới Nhập Vai AD" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Thế Giới Nhập Vai AD - Khởi đầu cho mọi hành trình Roleplay. Cộng đồng Google AI Studio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Thế Giới Nhập Vai AD</title>
    
    <!-- TẢI THƯ VIỆN SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      (function() {
        try {
          var mode = localStorage.getItem('app_theme_mode') || 'SYSTEM';
          var isDark = false;
          if (mode === 'DARK') {
            isDark = true;
          } else if (mode === 'LIGHT') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0a0a0a');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ĐOẠN MÃ THỬ NGHIỆM KẾT NỐI SUPABASE -->
    <script>
        // 1. BẠN CHỈ CẦN THAY 2 DÒNG NÀY BẰNG THÔNG TIN CỦA BẠN
        const supabaseUrl = 'https://ykhsbwclewixebafftky.supabase.co'; 
        const supabaseKey = 'sb_publishable_0wF7Ax8xD0RTaXj8dCZsCA_4UnIFRic';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function kiemTraSupabase() {
            console.log("Đang thử kết nối Supabase...");
            
            // Đã đổi thành bảng 'characters' vừa tạo
            const { data, error } = await supabase.from('characters').select('*').limit(1);
            
            if (error) {
                console.error("Lỗi Supabase:", error);
                alert("Lỗi kết nối Supabase: " + error.message + "\nHãy xem Console (F12) để biết chi tiết!");
            } else {
                console.log("Dữ liệu nhận được:", data);
                alert("Kết nối Supabase THÀNH CÔNG!\nDữ liệu trả về (mảng rỗng [] là chính xác vì bảng chưa có gì): " + JSON.stringify(data));
            }
        }
        
        // Đợi 3 giây sau khi trang web tải xong giao diện rồi mới chạy kiểm tra
        setTimeout(kiemTraSupabase, 3000);
    </script>
  </body>
</html>
